<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Página de Prueba - CableNet</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    header {
      background-image: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470');
      background-size: cover;
      background-position: center;
      height: 60vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-shadow: 2px 2px 5px black;
      font-size: 3rem;
      text-align: center;
      padding: 20px;
    }

    .promo {
      background: white;
      margin: 40px auto;
      padding: 30px;
      width: 80%;
      max-width: 800px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      text-align: center;
    }

    .promo img {
      width: 200px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .promo button {
      background: #007bff;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
    }

    .promo button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <header>
    SANTANDER 
  </header>

  <section class="promo">
    <h2>📘 Promoción Especial</h2>
    <img src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f" alt="Libro">
    <p>
      Descubre nuestro nuevo libro:  
      <strong>"El Camino del Éxito Digital"</strong>  
      Una guía práctica para emprendedores modernos.
    </p>
    <button>Comprar ahora</button>
  </section>

</body>
</html>
